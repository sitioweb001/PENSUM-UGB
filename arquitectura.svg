<text x='870' y='231' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='800' fill='#b45309'>WebAuthn (huella / Face ID)</text>
<text x='870' y='251' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>La credencial vive en el dispositivo,</text>
<text x='870' y='267.5' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>nunca sale de ahí ni pasa por Firebase.</text>
<line x1='170.0' y1='312' x2='170.0' y2='346' stroke='#1e40af' stroke-width='2' marker-end='url(#arrow)' />
<line x1='570.0' y1='312' x2='570.0' y2='346' stroke='#1e40af' stroke-width='2' marker-end='url(#arrow)' />
<line x1='970.0' y1='312' x2='970.0' y2='346' stroke='#1e40af' stroke-width='2' marker-end='url(#arrow)' />
<text x='570.0' y='332' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='700' fill='#1e3a8a'>HTTPS — tiempo real</text>
<rect x='40' y='368' width='1120' height='250' rx='14' fill='#0f172a' stroke='#0f172a' stroke-width='1.6' />
<text x='56' y='395' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='800' fill='#f1f5f9'>Firebase — proyecto ugb-pensum</text>
<rect x='66' y='410' width='220' height='56' rx='14' fill='#1e293b' stroke='#334155' stroke-width='1.6' />
<text x='82' y='437' font-family='Inter,Arial,sans-serif' font-size='11.5' font-weight='800' fill='#93c5fd'>firebase-bootstrap.js</text>
<text x='82' y='457' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>&lt;script type="module"&gt;</text>
<text x='82' y='473.5' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>conecta todo al arrancar</text>
<rect x='316' y='410' width='240' height='84' rx='14' fill='#1e293b' stroke='#334155' stroke-width='1.6' />
<text x='332' y='437' font-family='Inter,Arial,sans-serif' font-size='11.5' font-weight='800' fill='#93c5fd'>firebase-init.js</text>
<text x='332' y='457' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>Inicializa Firestore</text>
<text x='332' y='473.5' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>(ignoreUndefinedProperties: true)</text>
<text x='332' y='490.0' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>Auth anónima → authReady</text>
<rect x='316' y='508' width='240' height='56' rx='14' fill='#312e81' stroke='#4338ca' stroke-width='1.6' />
<text x='332' y='535' font-family='Inter,Arial,sans-serif' font-size='11.5' font-weight='800' fill='#c7d2fe'>Firebase Authentication</text>
<text x='332' y='555' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>1 usuario anónimo por dispositivo</text>
<rect x='586' y='410' width='240' height='84' rx='14' fill='#1e293b' stroke='#334155' stroke-width='1.6' />
<text x='602' y='437' font-family='Inter,Arial,sans-serif' font-size='11.5' font-weight='800' fill='#93c5fd'>firebase-db.js</text>
<text x='602' y='457' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>45 funciones: guardar / leer /</text>
<text x='602' y='473.5' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>escuchar (onSnapshot) / eliminar</text>
<rect x='586' y='508' width='240' height='68' rx='14' fill='#312e81' stroke='#4338ca' stroke-width='1.6' />
<text x='602' y='535' font-family='Inter,Arial,sans-serif' font-size='11.5' font-weight='800' fill='#c7d2fe'>Cloud Firestore</text>
<text x='602' y='555' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>estudiantes · huellasIndex · tecnicos ·</text>
<text x='602' y='571.5' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>actividadesPregrabadas · config</text>
<rect x='856' y='410' width='264' height='154' rx='14' fill='#1e293b' stroke='#334155' stroke-width='1.6' />
<text x='872' y='437' font-family='Inter,Arial,sans-serif' font-size='11.5' font-weight='800' fill='#93c5fd'>Fotos y firmas</text>
<text x='872' y='457' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>Se guardan como imagen</text>
<text x='872' y='473.5' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>comprimida en base64 dentro</text>
<text x='872' y='490.0' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>del propio documento de</text>
<text x='872' y='506.5' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>Firestore — sin Cloud Storage.</text>
<line x1='286' y1='438' x2='314' y2='448' stroke='#93c5fd' stroke-width='2' marker-end='url(#arrowl)' />
<line x1='436' y1='494' x2='436' y2='508' stroke='#93c5fd' stroke-width='2' marker-end='url(#arrowl)' />
<line x1='706' y1='494' x2='706' y2='508' stroke='#93c5fd' stroke-width='2' marker-end='url(#arrowl)' />
<text x='60' y='588' font-family='Inter,Arial,sans-serif' font-size='11' fill='#64748b'>Cada estudiante = 1 documento en /estudiantes/{nombre__carrera} con subcolecciones: huellas, bitacora, etc.</text>
<line x1='230.0' y1='346' x2='230.0' y2='314' stroke='#059669' stroke-width='2' marker-end='url(#arrow)' />
<text x='244.0' y='326' text-anchor='start' font-family='Inter,Arial,sans-serif' font-size='10' font-weight='700' fill='#059669'>onSnapshot: los otros</text>
<text x='244.0' y='339' text-anchor='start' font-family='Inter,Arial,sans-serif' font-size='10' font-weight='700' fill='#059669'>dispositivos reciben el</text>
<text x='244.0' y='352' text-anchor='start' font-family='Inter,Arial,sans-serif' font-size='10' font-weight='700' fill='#059669'>cambio sin recargar</text>
<text x='40' y='646' font-family='Inter,Arial,sans-serif' font-size='10.5' fill='#9ca3af'>No hay servidor propio ni Google Apps Script — el navegador es el único &quot;backend&quot; además de Firebase.</text>
