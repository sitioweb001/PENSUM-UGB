<text x='470' y='251' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>La credencial vive en el dispositivo,</text>
<text x='470' y='267.5' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>nunca sale de ahí ni pasa por Firebase.</text>
<rect x='840' y='86' width='320' height='226' rx='14' fill='#eef2ff' stroke='#3b82f6' stroke-width='1.6' />
