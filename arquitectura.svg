<text x='870' y='167' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>index.html + styles.css + app.js</text>
<text x='870' y='183.5' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>Service Worker cachea SOLO el cascarón</text>
