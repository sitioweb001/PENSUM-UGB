<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">UGB Pénsum — arquitectura actual (100% Firebase)</text>

  <!-- Estudiante -->
  <rect x="370" y="60" width="220" height="56" rx="10" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="480" y="93" text-anchor="middle" font-size="15" fill="#2d3748">🧑‍🎓 Estudiante (navegador)</text>

  <line x1="480" y1="116" x2="480" y2="150" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Frontend -->
  <rect x="330" y="150" width="300" height="64" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
  <text x="480" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#1a365d">INDEX_FINAL.html</text>
  <text x="480" y="198" text-anchor="middle" font-size="12" fill="#2c5282">login · notas · calendario · horario</text>

  <!-- Lineas hacia init.js y db.js -->
  <line x1="420" y1="214" x2="270" y2="270" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="214" x2="690" y2="270" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- firebase-init.js -->
  <rect x="140" y="272" width="260" height="60" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="270" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#7b341e">firebase-init.js</text>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#7b341e">config + auth anónima</text>

  <!-- firebase-db.js -->
  <rect x="560" y="272" width="260" height="60" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="690" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#7b341e">firebase-db.js</text>
  <text x="690" y="316" text-anchor="middle" font-size="11" fill="#7b341e">guardar / leer / escuchar</text>

  <!-- lineas hacia Auth y Firestore -->
  <line x1="270" y1="332" x2="270" y2="380" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="332" x2="690" y2="380" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <line x1="690" y1="470" x2="690" y2="422" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Firebase Auth -->
  <rect x="150" y="382" width="240" height="58" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
  <text x="270" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#22543d">Firebase Auth</text>
  <text x="270" y="425" text-anchor="middle" font-size="11" fill="#22543d">signInAnonymously</text>

  <!-- Cloud Firestore -->
  <rect x="570" y="382" width="240" height="90" rx="10" fill="#fff5f7" stroke="#d53f8c" stroke-width="1.8"/>
  <text x="690" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#702459">Cloud Firestore</text>
  <text x="690" y="428" text-anchor="middle" font-size="11" fill="#702459">colección "estudiantes"</text>
  <text x="690" y="445" text-anchor="middle" font-size="11" fill="#702459">onSnapshot — tiempo real</text>
  <text x="690" y="462" text-anchor="middle" font-size="10" fill="#a02060">ignoreUndefinedProperties: true</text>

  <!-- horarios.html -->
  <rect x="60" y="500" width="240" height="60" rx="10" fill="#faf5ff" stroke="#805ad5" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="180" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#44337a">horarios.html</text>
  <text x="180" y="544" text-anchor="middle" font-size="11" fill="#44337a">visor standalone</text>

  <line x1="330" y1="205" x2="330" y2="270" stroke="#805ad5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M330,270 C330,400 260,470 200,500" fill="none" stroke="#805ad5" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="240" y="360" font-size="10" fill="#553c9a">"¿Dónde estoy?" → window.open()</text>

  <!-- Segundo dispositivo -->
  <rect x="640" y="500" width="260" height="60" rx="10" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="770" y="526" text-anchor="middle" font-size="14" fill="#2d3748">🧑‍🎓 Otro dispositivo</text>
  <text x="770" y="544" text-anchor="middle" font-size="11" fill="#4a5568">recibe el cambio sin recargar</text>

  <path d="M770,500 C770,460 750,440 720,425" fill="none" stroke="#2b6cb0" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrow2)"/>

  <text x="480" y="610" text-anchor="middle" font-size="11" fill="#718096">Sin Apps Script, sin polling — todo pasa por Firestore en tiempo real.</text>
</svg>
