<rect width='1200' height='660' fill='#f3f4f6'/>
<text x='40' y='42' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='800' fill='#1e3a8a'>Arquitectura — Pénsum UGB</text>
<text x='40' y='64' font-family='Inter,Arial,sans-serif' font-size='12.5' fill='#6b7280'>Sin backend propio: el navegador habla directo con Firebase. Sin polling — los cambios se propagan solos con onSnapshot.</text>
<rect x='40' y='86' width='320' height='226' rx='14' fill='#eef2ff' stroke='#3b82f6' stroke-width='1.6' />
<text x='56' y='113' font-family='Inter,Arial,sans-serif' font-size='13.5' font-weight='800' fill='#1e3a8a'>Dispositivo A — celular</text>
<rect x='54' y='120' width='292' height='74' rx='14' fill='#ffffff' stroke='#e5e7eb' stroke-width='1.6' />
<text x='70' y='147' font-family='Inter,Arial,sans-serif' font-size='11.5' font-weight='800' fill='#111827'>Cascarón PWA</text>
<text x='70' y='167' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>index.html + styles.css + app.js</text>
<text x='70' y='183.5' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>Service Worker cachea SOLO el cascarón</text>
<rect x='54' y='204' width='292' height='90' rx='14' fill='#fff7ed' stroke='#fdba74' stroke-width='1.6' stroke-dasharray='6,5'/>
<text x='70' y='231' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='800' fill='#b45309'>WebAuthn (huella / Face ID)</text>
<text x='70' y='251' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>La credencial vive en el dispositivo,</text>
<text x='70' y='267.5' font-family='Inter,Arial,sans-serif' font-size='11' fill='#6b7280'>nunca sale de ahí ni pasa por Firebase.</text>
<rect x='440' y='86' width='320' height='226' rx='14' fill='#eef2ff' stroke='#3b82f6' stroke-width='1.6' />
<text x='456' y='113' font-family='Inter,Arial,sans-serif' font-size='13.5' font-weight='800' fill='#1e3a8a'>Dispositivo B — laptop</text>
<rect x='454' y='120' width='292' height='74' rx='14' fill='#ffffff' stroke='#e5e7eb' stroke-width='1.6' />
<text x='470' y='147' font-family='Inter,Arial,sans-serif' font-size='11.5' font-weight='800' fill='#111827'>Cascarón PWA</text>
