
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Editor de Logotipos Institucionales</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;600;700&display=swap');

:root{
  --bg:#f2f4f7;
  --panel:#ffffff;
  --panel-border:#e2e6ec;
  --text:#1c2333;
  --text-dim:#67707f;
  --accent:#0c447c;
  --accent-2:#0a3563;
  --accent-soft:#e7eefc;
  --danger:#c0392b;
  --danger-soft:#fbe9e7;
  --success:#1c8a4b;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(20,25,40,.04), 0 6px 20px rgba(20,25,40,.06);
  --grid-a:#e9ecf1;
  --grid-b:#dfe3ea;
  --input-bg:#f7f8fa;
  --input-border:#d7dce4;
}
html[data-theme="dark"]{
  --bg:#12151c;
  --panel:#1a1e28;
  --panel-border:#2a3040;
  --text:#eef1f7;
  --text-dim:#93a0b4;
  --accent:#5b9bd8;
  --accent-2:#7fb2e6;
  --accent-soft:#1e2a3d;
  --danger:#e5695c;
  --danger-soft:#3a2223;
  --success:#3fbf7f;
  --grid-a:#20242f;
  --grid-b:#262b38;
  --input-bg:#12151c;
  --input-border:#333a4a;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease, color .2s ease;
}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}

/* ---------- Header ---------- */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;
  background:var(--panel);
  border-bottom:1px solid var(--panel-border);
  position:sticky;top:0;z-index:50;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;}
.brand-badge{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;
  flex-shrink:0;
}
.brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;}
.brand span{display:block;font-size:11.5px;color:var(--text-dim);font-weight:500;}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap;}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:9px;border:1px solid var(--input-border);
  background:var(--panel);color:var(--text);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s ease;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff;}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--danger);border-color:var(--danger);}
.btn.danger:hover{background:var(--danger-soft);color:var(--danger);}
.btn.icon-only{padding:8px;width:36px;justify-content:center;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn svg{width:15px;height:15px;flex-shrink:0;}

/* ---------- Layout ---------- */
.app{
  display:flex;
  gap:0;
  padding:16px;
  align-items:flex-start;
  min-height:calc(100vh - 62px);
}
@media (max-width:980px){
  .app{flex-direction:column;}
}
.resizer{
  width:16px; flex:0 0 16px; cursor:col-resize; position:relative;
  display:flex; align-items:center; justify-content:center; align-self:stretch;
}
.resizer::after{ content:""; width:3px; height:48px; border-radius:3px; background:var(--input-border); transition:background .15s; }
.resizer:hover::after, .resizer.dragging::after{ background:var(--accent); }
@media (max-width:980px){ .resizer{display:none;} }

/* ---------- Preview pane ---------- */
.preview-pane{
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  position:sticky;
  top:78px;
  flex:1 1 auto;
  min-width:280px;
}
@media (max-width:980px){ .preview-pane{position:relative;top:0;} }

.preview-toolbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;border-bottom:1px solid var(--panel-border);
  flex-wrap:wrap;
}
.preview-toolbar .spacer{flex:1;}
.zoom-group{display:flex;align-items:center;gap:4px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;padding:3px;}
.zoom-group button{width:28px;height:28px;border:none;background:transparent;border-radius:6px;cursor:pointer;color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center;}
.zoom-group button:hover{background:var(--panel);color:var(--accent);}
.zoom-value{font-size:12px;font-weight:600;color:var(--text-dim);min-width:42px;text-align:center;}

.canvas-wrap{
  position:relative;
  height:460px;
  overflow:auto;
  background-image:
    linear-gradient(45deg, var(--grid-a) 25%, transparent 25%),
    linear-gradient(-45deg, var(--grid-a) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--grid-a) 75%),
    linear-gradient(-45deg, transparent 75%, var(--grid-a) 75%);
  background-size:22px 22px;
  background-position:0 0, 0 11px, 11px -11px, -11px 0px;
  background-color:var(--grid-b);
  display:flex;
  align-items:center;
  justify-content:center;
}
.canvas-stage{
  display:flex;align-items:center;justify-content:center;
  transition:transform .08s ease-out;
  padding:40px;
}
#svgHolder{display:block;filter:drop-shadow(0 2px 10px rgba(0,0,0,.12));}
#svgHolder svg{display:block;max-width:none;}

.preview-meta{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 14px;border-top:1px solid var(--panel-border);
  font-size:11.5px;color:var(--text-dim);
}
.preview-meta b{color:var(--text);font-weight:600;}

/* ---------- Controls pane ---------- */
.controls-pane{
  display:flex;flex-direction:column;gap:12px;
  width:400px; flex:0 0 auto; min-width:300px; max-width:720px; box-sizing:border-box;
}
@media (max-width:980px){ .controls-pane{width:100% !important; max-width:100%;} }

.subsection-head{display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 0;user-select:none;}
.subsection-head b{font-size:12px;flex:1;font-weight:700;display:flex;align-items:center;}
.subsection-head .chev{color:var(--text-dim);transition:transform .15s;display:flex;flex-shrink:0;}
.subsection-head .chev svg{width:12px;height:12px;}
.icon-sm{display:inline-flex;vertical-align:-3px;margin-right:6px;flex-shrink:0;}
.icon-sm svg{width:14px;height:14px;display:block;}

.card{
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card-head{
  display:flex;align-items:center;gap:10px;
  padding:13px 15px;cursor:pointer;user-select:none;
}
.card-head .ci{
  width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.card-head .ci svg{width:14px;height:14px;}
.card-head h3{font-size:13.5px;margin:0;flex:1;font-weight:700;}
.card-head .chev{color:var(--text-dim);transition:transform .18s ease;flex-shrink:0;}
.card-head .chev svg{width:14px;height:14px;}
.card.collapsed .chev{transform:rotate(-90deg);}
.card-body{padding:0 15px 16px 15px;display:flex;flex-direction:column;gap:14px;}
.card.collapsed .card-body{display:none;}

.field{display:flex;flex-direction:column;gap:6px;}
.field-row{display:flex;gap:10px;}
.field-row > .field{flex:1;min-width:0;}
label.flabel{font-size:11.5px;font-weight:600;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center;}
label.flabel .val{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;}

input[type="text"],input[type="number"],textarea,select{
  width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--input-border);
  background:var(--input-bg);color:var(--text);font-size:13px;font-family:inherit;
  transition:border-color .15s;
}
input[type="text"]:focus,input[type="number"]:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--accent);
}
textarea{resize:vertical;min-height:52px;line-height:1.4;}
select{cursor:pointer;}

input[type="range"]{
  -webkit-appearance:none;width:100%;height:5px;border-radius:3px;background:var(--input-border);outline:none;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;
  border:2px solid var(--panel);box-shadow:0 0 0 1px var(--accent);
}
input[type="range"]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--accent);
}

.seg{display:flex;border:1px solid var(--input-border);border-radius:8px;overflow:hidden;}
.seg button{
  flex:1;padding:7px 6px;border:none;background:var(--input-bg);color:var(--text-dim);
  cursor:pointer;font-size:12px;font-weight:600;border-right:1px solid var(--input-border);
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--accent);color:#fff;}
.seg button svg{width:13px;height:13px;}

.swatches{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{
  width:38px;height:38px;border-radius:9px;cursor:pointer;border:2px solid var(--input-border);
  position:relative;flex-shrink:0;transition:transform .12s;
}
.swatch:hover{transform:scale(1.06);}
.swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.swatch.active::after{
  content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);font-size:15px;font-weight:700;
}
.color-custom-row{display:flex;align-items:center;gap:10px;}
input[type="color"]{
  -webkit-appearance:none;width:44px;height:38px;border:1px solid var(--input-border);border-radius:9px;padding:2px;background:var(--input-bg);cursor:pointer;
}
input[type="color"]::-webkit-color-swatch-wrapper{padding:0;}
input[type="color"]::-webkit-color-swatch{border-radius:6px;border:none;}

.check-row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text);cursor:pointer;user-select:none;}
.check-row input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}

.hint{font-size:11px;color:var(--text-dim);line-height:1.5;margin:0;}

.lock-banner{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;padding:10px 12px;
  font-size:12px;color:var(--text);position:relative;
}
.lock-banner svg{width:16px;height:16px;color:var(--accent);flex-shrink:0;margin-top:1px;}
.lock-banner b{display:block;margin-bottom:2px;}
.lock-tip{
  position:absolute;bottom:100%;left:0;margin-bottom:6px;background:#111;color:#fff;
  padding:7px 10px;border-radius:7px;font-size:11.5px;width:230px;line-height:1.4;
  opacity:0;pointer-events:none;transition:opacity .15s;z-index:5;
}
.lock-banner:hover .lock-tip{opacity:1;}

.inst-preview{
  display:flex;align-items:center;justify-content:center;background:var(--input-bg);
  border:1px dashed var(--input-border);border-radius:9px;padding:10px;height:90px;
}
.inst-preview svg{height:100%;width:auto;}

.block-card{
  border:1px solid var(--panel-border);border-radius:10px;overflow:hidden;background:var(--input-bg);
}
.block-card-head{
  display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);
}
.block-card-head .btag{
  width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.block-card-head .btitle{flex:1;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.block-card-head .bactions{display:flex;gap:4px;}
.block-card-head .bactions button{
  width:26px;height:26px;border:none;background:transparent;border-radius:6px;cursor:pointer;
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;
}
.block-card-head .bactions button:hover{background:var(--danger-soft);color:var(--danger);}
.block-card-head .bactions button.tog:hover{background:var(--accent-soft);color:var(--accent);}
.block-card-head .bactions svg{width:14px;height:14px;}
.block-card-body{padding:12px;display:flex;flex-direction:column;gap:11px;}
.block-card.inactive{opacity:.55;}
.block-card.inactive .block-card-body{display:none;}

.toggle-switch{
  width:36px;height:20px;border-radius:20px;background:var(--input-border);position:relative;cursor:pointer;
  flex-shrink:0;transition:background .15s;
}
.toggle-switch.on{background:var(--success);}
.toggle-switch::after{
  content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;
  transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.toggle-switch.on::after{left:18px;}

.add-block-btn{
  width:100%;padding:11px;border:1.5px dashed var(--input-border);border-radius:10px;background:transparent;
  color:var(--text-dim);font-weight:600;font-size:12.5px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:6px;transition:all .15s;
}
.add-block-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.add-block-btn:disabled{opacity:.4;cursor:not-allowed;}
.add-block-btn svg{width:15px;height:15px;}

.preset-btn{
  display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;
  padding:11px 13px;border:1px solid var(--input-border);border-radius:10px;background:var(--input-bg);
  cursor:pointer;transition:all .15s;
}
.preset-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
.preset-btn b{font-size:12.5px;}
.preset-btn span{font-size:11px;color:var(--text-dim);font-family:ui-monospace,monospace;}

.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.res-options{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.res-options button{
  padding:9px 4px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);
  cursor:pointer;font-size:12px;font-weight:700;color:var(--text-dim);
}
.res-options button.active{background:var(--accent);border-color:var(--accent);color:#fff;}

#toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:#1c2333;color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;
  box-shadow:0 6px 20px rgba(0,0,0,.25);animation:toastIn .2s ease;display:flex;align-items:center;gap:8px;
}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.modal-overlay{
  position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;
  z-index:300;padding:20px;
}
.modal{
  background:var(--panel);border-radius:14px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal h3{margin:0 0 8px;font-size:16px;}
.modal p{margin:0 0 18px;font-size:13px;color:var(--text-dim);line-height:1.5;}
.modal .mactions{display:flex;gap:8px;justify-content:flex-end;}

.file-drop{
  border:1.5px dashed var(--input-border);border-radius:9px;padding:12px;text-align:center;font-size:11.5px;
  color:var(--text-dim);cursor:pointer;transition:all .15s;
}
.file-drop:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--input-border);border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}
</style>
</head>
<body data-theme="light">

<header class="topbar">
  <div class="brand">
    <div class="brand-badge">GS</div>
    <div>
      <h1>Editor de Logotipos Institucionales</h1>
      <span>Gobierno de El Salvador &mdash; Composición de encabezados oficiales</span>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn ghost icon-only" id="themeToggle" title="Cambiar modo claro/oscuro"></button>
    <button class="btn" id="btnSaveProject" title="Guardar configuración en este navegador">Guardar proyecto</button>
    <button class="btn" id="btnLoadProject" title="Cargar configuración guardada">Cargar proyecto</button>
    <button class="btn danger" id="btnReset" title="Restablecer todos los valores">Restablecer</button>
  </div>
</header>

<div class="app">

  <!-- PREVIEW -->
  <section class="preview-pane">
    <div class="preview-toolbar">
      <div class="zoom-group">
        <button id="zoomOut" title="Alejar">−</button>
        <span class="zoom-value" id="zoomValue">100%</span>
        <button id="zoomIn" title="Acercar">+</button>
      </div>
      <button class="btn ghost" id="zoomReset">Restablecer zoom</button>
      <button class="btn ghost" id="zoomFit">Ajustar a pantalla</button>
      <div class="spacer"></div>
      <span class="hint" style="margin:0;">Fondo transparente — solo referencia visual</span>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <div class="canvas-stage" id="canvasStage">
        <div id="svgHolder"></div>
      </div>
    </div>
    <div class="preview-meta">
      <span>Dimensiones: <b id="metaSize">—</b></span>
      <span>Bloques activos: <b id="metaBlocks">—</b></span>
      <span>Fondo: <b>Transparente</b></span>
    </div>
  </section>

  <!-- CONTROLS -->
  <div class="resizer" id="paneResizer" title="Arrastra para cambiar el ancho"></div>
  <aside class="controls-pane" id="controlsPane"></aside>

</div>

<div id="toast-wrap"></div>

<script id="app-script">
/* =========================================================================
   Editor de Logotipos Institucionales — Gobierno de El Salvador
   Todo el código corre 100% en el navegador (sin backend).
   ========================================================================= */

/* ---------- Iconografía inline (sin librerías externas) ---------- */
const ICONS = {
  sun:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2 12h2.4M19.6 12H22M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 14.7A8.6 8.6 0 1 1 9.3 3.6a7 7 0 0 0 11.1 11.1z"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l7.5 3v5.3c0 4.8-3.2 8.9-7.5 10.2-4.3-1.3-7.5-5.4-7.5-10.2V5.5z"/></svg>',
  layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function escapeXml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

/* Sanea un fragmento SVG externo: elimina <script>, atributos on*, y protocolos peligrosos. */
function sanitizeSvgString(svgText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(svgText, 'image/svg+xml');
  if (doc.querySelector('parsererror')) return null;
  const root = doc.documentElement;
  const walk = (node) => {
    if (node.nodeType === 1) {
      if (/^script$/i.test(node.tagName)) { node.remove(); return; }
      [...node.attributes].forEach(attr => {
        const n = attr.name.toLowerCase();
        if (n.startsWith('on')) node.removeAttribute(attr.name);
        if ((n === 'href' || n === 'xlink:href') && /^\s*javascript:/i.test(attr.value)) node.removeAttribute(attr.name);
      });
      [...node.children].forEach(walk);
    }
  };
  walk(root);
  return root;
}

/* Garantiza que un estado cargado desde una versión anterior (autoguardado o
   proyecto guardado antes de esta actualización) tenga la forma completa,
   sin perder los datos que sí existían. */
function ensureStateShape(s) {
  const d = defaultState();
  if (!s.inst) s.inst = d.inst;
  else s.inst = Object.assign({}, d.inst, s.inst);
  if (!s.divider) s.divider = d.divider;
  if (!Array.isArray(s.blocks)) s.blocks = d.blocks;
  return s;
}

const measureCanvas = document.createElement('canvas');

function measureLineWidth(text, fontFamily, fontSizePx, fontWeight, letterSpacingPx) {
  if (!text) return 0;
  measureCtx.font = `${fontWeight} ${fontSizePx}px ${fontFamily}`;
  const base = measureCtx.measureText(text).width;
  const extra = Math.max(0, text.length - 1) * (letterSpacingPx || 0);
  return base + extra;
}

  const gColor = resolveGlobalColor();
  const gScale = clamp(state.globalScale, 0.3, 4);
  const compH = clamp(state.logoHeight, 40, 600) * gScale;
  const gap = clamp(state.gapBlocks, 0, 160) * gScale;
  const padY = clamp(state.paddingInner, 0, 80) * gScale;
  const divThickness = clamp(state.divider.thickness, 1, 12) * gScale;
  const divHeightRaw = clamp(state.divider.height, 10, 400) * gScale;
  const divHeight = Math.min(divHeightRaw, compH * 0.98);

  const inst = state.inst;
  const instColor = state.recolorInstitutional ? gColor : '#001A70';
  const useCustom = !!(inst.useCustomImage && inst.customImage);

  const showCaption = inst.showCaption && inst.caption && inst.caption.trim().length > 0;
  const capFontFamily = resolveFontFamily(inst.captionFont);
  const capFontSize = clamp(inst.captionSize, 8, 60) * gScale;
  const capLineHeight = capFontSize * clamp(inst.captionLineHeight, 0.8, 2.2);
  const capLetterSpacing = (inst.captionLetterSpacing || 0) * gScale;
  const capLines = showCaption
    ? inst.caption.split('\n').map(l => inst.captionUppercase ? l.toLocaleUpperCase('es') : l)

  const instUnitH = compH * clamp(state.instScale, 0.4, 2.2);

  let capMaxW = 0;
  capLines.forEach(l => { capMaxW = Math.max(capMaxW, measureLineWidth(l, capFontFamily, capFontSize, inst.captionWeight, capLetterSpacing)); });

  const instBlockW = Math.max(graphicW, capMaxW);
  const instTotalUnitH = graphicH + capH;
  const instUnitY = (compH - instTotalUnitH) / 2;

  const instGraphic = { x: (instBlockW - graphicW) / 2, y: instUnitY, w: graphicW, h: graphicH, color: instColor, useCustom, image: inst.customImage };
  const instCaption = capLines.length ? {
    lines: capLines,
    x: instBlockW / 2,
    firstY: instUnitY + graphicH + capGap + capFontSize * 0.78,
    lineHeight: capLineHeight,
    fontFamily: capFontFamily, fontSize: capFontSize, weight: inst.captionWeight, letterSpacing: capLetterSpacing,
    color: instColor,
  } : null;

  const layout = {
    compH, gColor,
    inst: { x: 0, y: 0, w: instBlockW, h: compH, color: instColor },
    instGraphic, instCaption,
    dividers: [],
    textBlocks: [],
  };

  let cursor = instBlockW;
  const activeBlocks = state.blocks.filter(b => b.active && b.text && b.text.trim().length > 0);
  const divColor = state.divider.color || gColor;

  activeBlocks.forEach((block) => {
    cursor += gap;
    const divY = (compH - divHeight) / 2;
    layout.dividers.push({ x: cursor, y: divY, w: divThickness, h: divHeight, color: divColor });
    cursor += divThickness + gap;

    const fontFamily = resolveFontFamily(block.font);
    const fontSize = clamp(block.size, 8, 160) * gScale;
    const letterSpacing = (block.letterSpacing || 0) * gScale;
    const lineHeightPx = fontSize * clamp(block.lineHeight, 0.8, 2.2);
    const rawLines = (block.text || '').split('\n');
    const lines = rawLines.map(l => block.uppercase ? l.toLocaleUpperCase('es') : l);
    const weight = block.weight;

    let maxLineW = 0;
    lines.forEach(l => { maxLineW = Math.max(maxLineW, measureLineWidth(l, fontFamily, fontSize, weight, letterSpacing)); });
    const blockW = Math.max(maxLineW, (block.minWidth || 0) * gScale);

    let anchorX, textAnchor;
    if (block.align === 'center') { anchorX = cursor + blockW / 2; textAnchor = 'middle'; }
    else if (block.align === 'right') { anchorX = cursor + blockW; textAnchor = 'end'; }
    else { anchorX = cursor; textAnchor = 'start'; }

    const textBlockH = lines.length * lineHeightPx;
    let firstBaselineY;
    if (block.valign === 'top') firstBaselineY = padY + fontSize * 0.78;
    else if (block.valign === 'bottom') firstBaselineY = compH - padY - textBlockH + fontSize * 0.78;
    else firstBaselineY = (compH - textBlockH) / 2 + fontSize * 0.78;

    const fillColor = block.useColorOverride ? (block.colorOverride || gColor) : gColor;
    const ys = lines.map((_, i) => firstBaselineY + i * lineHeightPx);

    layout.textBlocks.push({
      lines, x: anchorX, ys, textAnchor, fontFamily, fontSize, weight, letterSpacing, color: fillColor,
    });

    cursor += blockW;
  });

  layout.totalW = cursor;
  layout.totalH = compH;
  return layout;
}

/* ========================================================================
   SVG A PARTIR DEL LAYOUT
   ======================================================================== */
function svgFromLayout(layout) {
  const parts = [];
  const fontFaceFamilies = new Set();

  const g = layout.instGraphic;
  if (g.useCustom && g.image) {
    const img = g.image;
    if (img.kind === 'svg') {
      parts.push(
        `<svg x="${r2(g.x)}" y="${r2(g.y)}" width="${r2(g.w)}" height="${r2(g.h)}" ` +
        `viewBox="${escapeXml(img.viewBox)}" style="overflow:hidden" preserveAspectRatio="xMidYMid meet">${img.innerMarkup}</svg>`
      );
    } else {
      parts.push(
        `<image x="${r2(g.x)}" y="${r2(g.y)}" width="${r2(g.w)}" height="${r2(g.h)}" ` +
        `href="${img.dataUrl}" preserveAspectRatio="xMidYMid meet"/>`
      );
    }
  } else {
    parts.push(
      `<svg x="${r2(g.x)}" y="${r2(g.y)}" width="${r2(g.w)}" height="${r2(g.h)}" ` +
      `viewBox="${CREST_VB.minX} ${CREST_VB.minY} ${CREST_VB.w} ${CREST_VB.h}" style="overflow:hidden" preserveAspectRatio="xMidYMid meet">` +
      `<g fill="${g.color}">${ESCUDO_PATHS}</g></svg>`
    );
  }

  if (layout.instCaption) {
    const cap = layout.instCaption;
    fontFaceFamilies.add(cap.fontFamily);
    const lsAttr = cap.letterSpacing ? ` letter-spacing="${r2(cap.letterSpacing)}"` : '';
    const tspans = cap.lines.map((line, i) =>
      `<tspan x="${r2(cap.x)}" y="${r2(cap.firstY + i * cap.lineHeight)}">${escapeXml(line)}</tspan>`
    ).join('');
    parts.push(
      `<text text-anchor="middle" font-family="${escapeXml(cap.fontFamily)}" font-size="${r2(cap.fontSize)}" ` +
      `font-weight="${cap.weight}"${lsAttr} fill="${cap.color}" style="white-space:pre">${tspans}</text>`
    );
  }

  layout.dividers.forEach(d => {
    parts.push(`<rect x="${r2(d.x)}" y="${r2(d.y)}" width="${r2(d.w)}" height="${r2(d.h)}" fill="${d.color}"/>`);
  });

  layout.textBlocks.forEach(tb => {
    fontFaceFamilies.add(tb.fontFamily);
    const lsAttr = tb.letterSpacing ? ` letter-spacing="${r2(tb.letterSpacing)}"` : '';
    const tspans = tb.lines.map((line, i) =>
      `<tspan x="${r2(tb.x)}" y="${r2(tb.ys[i])}">${escapeXml(line)}</tspan>`
    ).join('');
    parts.push(
      `<text text-anchor="${tb.textAnchor}" font-family="${escapeXml(tb.fontFamily)}" ` +
      `font-size="${r2(tb.fontSize)}" font-weight="${tb.weight}"${lsAttr} fill="${tb.color}" ` +
      `style="white-space:pre">${tspans}</text>`
    );
  });

  let styleBlock = '';
  if (state.customFont && fontFaceFamilies.has(state.customFont.family)) {
    styleBlock = `<style>@font-face{font-family:"${state.customFont.family}";src:url(${state.customFont.data}) format("${state.customFont.format}");}</style>`;
  }

  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${r2(layout.totalW)} ${r2(layout.totalH)}" ` +
    `width="${r2(layout.totalW)}" height="${r2(layout.totalH)}">` +
    `<title>Logotipo institucional</title>${styleBlock}${parts.join('')}</svg>`;

  return svg;
}

function buildComposition() {
  const layout = computeLayout();
  const svg = svgFromLayout(layout);
  return { svg, width: layout.totalW, height: layout.totalH, activeCount: layout.textBlocks.length, layout };
}

/* ========================================================================
   VISTA PREVIA
   ======================================================================== */
const svgHolder = document.getElementById('svgHolder');
const canvasStage = document.getElementById('canvasStage');
const canvasWrap = document.getElementById('canvasWrap');
const zoomValueEl = document.getElementById('zoomValue');
const metaSizeEl = document.getElementById('metaSize');
const metaBlocksEl = document.getElementById('metaBlocks');

let lastComposition = null;

function renderPreview() {
  const comp = buildComposition();
  lastComposition = comp;
  svgHolder.innerHTML = comp.svg;
  applyZoomTransform();
  metaSizeEl.textContent = `${Math.round(comp.width)} × ${Math.round(comp.height)} px`;
  metaBlocksEl.textContent = `${comp.activeCount + 1} de 4`;
  scheduleAutosave();
}

function applyZoomTransform() {
  canvasStage.style.transform = `scale(${zoom})`;
  zoomValueEl.textContent = Math.round(zoom * 100) + '%';
}

document.getElementById('zoomIn').addEventListener('click', () => { zoom = clamp(zoom + 0.1, 0.1, 4); applyZoomTransform(); });
document.getElementById('zoomOut').addEventListener('click', () => { zoom = clamp(zoom - 0.1, 0.1, 4); applyZoomTransform(); });
document.getElementById('zoomReset').addEventListener('click', () => { zoom = 1; applyZoomTransform(); });
document.getElementById('zoomFit').addEventListener('click', () => {
  if (!lastComposition) return;
  const wrapRect = canvasWrap.getBoundingClientRect();
  const availW = wrapRect.width - 80;
  const availH = wrapRect.height - 80;
  const scaleW = availW / lastComposition.width;
  const scaleH = availH / lastComposition.height;
  zoom = clamp(Math.min(scaleW, scaleH), 0.1, 4);
  applyZoomTransform();
});

/* ========================================================================
   PANEL REDIMENSIONABLE — arrastrar para cambiar el ancho del panel de
   controles (y por lo tanto agrandar/achicar la vista previa).
   ======================================================================== */
(function setupResizer() {
  const resizer = document.getElementById('paneResizer');
  const panel = document.getElementById('controlsPane');
  if (!resizer || !panel) return;
  let dragging = false, startX = 0, startW = 0;

  function begin(clientX) {
    dragging = true;
    startX = clientX;
    startW = panel.getBoundingClientRect().width;
    resizer.classList.add('dragging');
    document.body.style.userSelect = 'none';
  }
  function move(clientX) {
    if (!dragging) return;
    const dx = startX - clientX; // arrastrar hacia la izquierda agranda el panel de controles
    const newW = clamp(startW + dx, 300, 720);
    panel.style.width = newW + 'px';
  }
  function end() {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.userSelect = '';
  }

  resizer.addEventListener('mousedown', (e) => { begin(e.clientX); e.preventDefault(); });
  window.addEventListener('mousemove', (e) => move(e.clientX));
  window.addEventListener('mouseup', end);

  resizer.addEventListener('touchstart', (e) => { begin(e.touches[0].clientX); }, { passive: true });
  window.addEventListener('touchmove', (e) => { if (dragging) move(e.touches[0].clientX); }, { passive: true });
  window.addEventListener('touchend', end);
})();


/* ========================================================================
   AUTOGUARDADO (localStorage) — no requiere acción del usuario
   ======================================================================== */
const AUTOSAVE_KEY = 'logoEditorAutosave_v1';
const PROJECT_KEY = 'logoEditorProject_v1';
const THEME_KEY = 'logoEditorTheme';

const scheduleAutosave = debounce(() => {
  try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(state)); } catch (e) { /* almacenamiento no disponible */ }
}, 400);

function loadAutosave() {
  try {
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.blocks)) return null;
    return parsed;
  } catch (e) { return null; }
}

/* ========================================================================
   TOASTS
   ======================================================================== */
function toast(msg, kind = '') {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(() => el.remove(), 250); }, 2400);
}

function applyTheme(t) {
  uiTheme = t;
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('themeToggle');
  btn.innerHTML = t === 'dark' ? ICONS.sun : ICONS.moon;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
}

function cardWrap(key, icon, title, bodyHtml) {
  const collapsed = collapseState[key] ? 'collapsed' : '';
  return `
  <div class="card ${collapsed}" data-card="${key}">
    <div class="card-head" onclick="toggleCard('${key}')">
      <div class="ci">${icon}</div>
      <h3>${title}</h3>
      <div class="chev">${ICONS.chev}</div>
    </div>
    <div class="card-body">${bodyHtml}</div>

}

function toggleCard(key) {
  collapseState[key] = !collapseState[key];
  const card = controlsPane.querySelector(`[data-card="${key}"]`);
  if (card) card.classList.toggle('collapsed', collapseState[key]);
}

function renderControls() {
  controlsPane.innerHTML =
    renderInstitutionalCard() +

    renderSeparatorsCard() +
    renderColorCard() +
    renderSizeCard() +

}

/* ---------- Bloque institucional ---------- */
function defaultCrestPreviewSvg() {

}
function customImagePreviewSvg() {
  const img = state.inst.customImage;
  if (!img) return defaultCrestPreviewSvg();
  if (img.kind === 'svg') return `<svg viewBox="${escapeHtml(img.viewBox)}" style="height:100%">${img.innerMarkup}</svg>`;
  return `<img src="${img.dataUrl}" style="height:100%;width:auto;">`;
}
function instFontSelectHtml(current) {
  let opts = FONT_OPTIONS.map(f => `<option value="${escapeHtml(f.value)}" ${current===f.value?'selected':''}>${f.label}</option>`).join('');
  if (state.customFont) opts += `<option value="${CUSTOM_FONT_VALUE}" ${current===CUSTOM_FONT_VALUE?'selected':''}>Personalizada: ${escapeHtml(state.customFont.originalName||'')}</option>`;
  return `<select onchange="updateInstField('captionFont', this.value)">${opts}</select>`;
}
function updateInstField(field, value) {
  state.inst[field] = value;
  renderPreview();
}

/* ========================================================================
   DESCARGA GENÉRICA
   ======================================================================== */
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

/* ========================================================================
   EXPORTAR SVG
   ======================================================================== */
function exportSVG() {
  try {
    const comp = buildComposition();
    if (comp.width < 1 || comp.height < 1) { toast('La composición está vacía', 'err'); return; }
    const xmlDecl = '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n';
    const blob = new Blob([xmlDecl + comp.svg], { type: 'image/svg+xml;charset=utf-8' });
    downloadBlob(blob, 'logotipo-institucional.svg');
    toast('SVG descargado', 'ok');
  } catch (e) {
    console.error(e);
    toast('Ocurrió un error al generar el SVG', 'err');
  }
}

/* ========================================================================
   EXPORTAR PNG
   Se dibuja directamente en <canvas>: el escudo se rasteriza desde un SVG
   100% autocontenido (sin referencias externas) y el texto se dibuja con
   las APIs nativas de Canvas. Esto evita por completo los problemas de
   "canvas tainting" que ocurrirían al rasterizar un SVG con fuentes web
   externas (@import) a través de una etiqueta <img>.
   ======================================================================== */
function loadSvgImage(svgStr) {
  return new Promise((resolve, reject) => {
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

/* Los data: URI nunca "manchan" el canvas (no son de origen cruzado), así que
   son seguros para drawImage sin importar su tamaño de origen. */
function loadRasterImage(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = (e) => reject(e);
    img.src = dataUrl;
  });
}

function drawCanvasLine(ctx, text, x, yBaseline, anchor, letterSpacing) {
  ctx.textBaseline = 'alphabetic';
  if (!letterSpacing) {
    ctx.textAlign = anchor === 'middle' ? 'center' : anchor === 'end' ? 'right' : 'left';
    ctx.fillText(text, x, yBaseline);
    return;
  }
  const chars = Array.from(text);
  const widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + letterSpacing * Math.max(0, chars.length - 1);
  let startX;
  if (anchor === 'middle') startX = x - total / 2;
  else if (anchor === 'end') startX = x - total;
  else startX = x;
  ctx.textAlign = 'left';
  let cx = startX;
  chars.forEach((c, i) => { ctx.fillText(c, cx, yBaseline); cx += widths[i] + letterSpacing; });
}

async function drawLayoutToCanvas(layout, scale) {
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(layout.totalW * scale));
  canvas.height = Math.max(1, Math.round(layout.totalH * scale));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, layout.totalW, layout.totalH);

  // Importante: el SVG/imagen fuente se rasteriza UNA sola vez a su tamaño intrínseco
  // (el que declaren sus atributos width/height) y luego drawImage solo reescala ese
  // mapa de bits. Por eso el ancho/alto aquí deben ser los del PNG final (con "scale"
  // ya aplicado) y no los valores lógicos de la composición; de lo contrario la imagen
  // sale borrosa en exportaciones a 2x/3x/4x aunque el resto del PNG se vea nítido.
  const g = layout.instGraphic;
  const gPxW = Math.max(1, g.w * scale);
  const gPxH = Math.max(1, g.h * scale);
  let gImg;
  if (g.useCustom && g.image) {
    if (g.image.kind === 'svg') {
      const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="${gPxW}" height="${gPxH}" viewBox="${g.image.viewBox}">${g.image.innerMarkup}</svg>`;
      gImg = await loadSvgImage(svgStr);
    } else {
      gImg = await loadRasterImage(g.image.dataUrl);
    }
  } else {
    const instSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="${gPxW}" height="${gPxH}" viewBox="${CREST_VB.minX} ${CREST_VB.minY} ${CREST_VB.w} ${CREST_VB.h}"><g fill="${g.color}">${ESCUDO_PATHS}</g></svg>`;
    gImg = await loadSvgImage(instSvg);
  }
  ctx.drawImage(gImg, g.x, g.y, g.w, g.h);

  if (layout.instCaption) {
    const cap = layout.instCaption;
    ctx.fillStyle = cap.color;
    ctx.font = `${cap.weight} ${cap.fontSize}px ${cap.fontFamily}`;
    cap.lines.forEach((line, i) => drawCanvasLine(ctx, line, cap.x, cap.firstY + i * cap.lineHeight, 'middle', cap.letterSpacing));
  }

  layout.dividers.forEach(d => { ctx.fillStyle = d.color; ctx.fillRect(d.x, d.y, d.w, d.h); });

  layout.textBlocks.forEach(tb => {
    ctx.fillStyle = tb.color;
    ctx.font = `${tb.weight} ${tb.fontSize}px ${tb.fontFamily}`;
    tb.lines.forEach((line, i) => drawCanvasLine(ctx, line, tb.x, tb.ys[i], tb.textAnchor, tb.letterSpacing));
  });

  return canvas;
}

async function exportPNG() {
  try { await document.fonts.ready; } catch (e) { /* continua de todas formas */ }
  const layout = computeLayout();
  if (layout.totalW < 1 || layout.totalH < 1) { toast('La composición está vacía', 'err'); return; }
  let scale = pngCustomWidth ? (pngCustomWidth / layout.totalW) : pngResolution;
  scale = clamp(scale, 0.1, 80);
  try {
    const canvas = await drawLayoutToCanvas(layout, scale);
    canvas.toBlob((blob) => {
      if (!blob) { toast('No se pudo generar el PNG', 'err'); return; }
      downloadBlob(blob, 'logotipo-institucional.png');
      toast(`PNG descargado (${canvas.width}×${canvas.height}px)`, 'ok');
    }, 'image/png');
  } catch (e) {
    console.error(e);
    toast('Ocurrió un error al generar el PNG', 'err');
  }
}

/* ========================================================================
   FUENTE PERSONALIZADA (@font-face)
   ======================================================================== */
function handleCustomFont(evt) {
  const file = evt.target.files && evt.target.files[0];
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const fmtMap = { woff2: 'woff2', woff: 'woff', ttf: 'truetype', otf: 'opentype' };
  const format = fmtMap[ext];
  if (!format) { toast('Formato no soportado. Usa .woff, .woff2, .ttf u .otf', 'err'); return; }

  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    const family = 'CustomFont_' + uid();
    try {
      const fontFace = new FontFace(family, `url(${dataUrl})`);
      fontFace.load().then((loaded) => {
        document.fonts.add(loaded);
        state.customFont = { family, data: dataUrl, format, originalName: file.name };
        renderControls();
        renderPreview();
        toast('Fuente personalizada cargada: ' + file.name, 'ok');
      }).catch((err) => {
        console.error(err);
        toast('No se pudo cargar el archivo de fuente', 'err');
      });
    } catch (err) {
      console.error(err);
      toast('No se pudo procesar el archivo de fuente', 'err');
    }
  };
  reader.onerror = () => toast('Error al leer el archivo de fuente', 'err');
  reader.readAsDataURL(file);
  evt.target.value = '';
}

/* ========================================================================
   IMAGEN PERSONALIZADA PARA EL BLOQUE INSTITUCIONAL (SVG, PNG o JPG)
   ======================================================================== */
function resetInstImage() {
  state.inst.useCustomImage = false;
  state.inst.customImage = null;
  renderControls();
  renderPreview();
  toast('Escudo oficial restaurado', 'ok');
}

function handleInstImageUpload(evt) {
  const file = evt.target.files && evt.target.files[0];
  if (!file) return;
  const isSvg = file.type === 'image/svg+xml' || /\.svg$/i.test(file.name);
  const isRaster = /^image\/(png|jpe?g)$/.test(file.type) || /\.(png|jpe?g)$/i.test(file.name);
  if (!isSvg && !isRaster) { toast('Formato no soportado. Usa SVG, PNG o JPG', 'err'); evt.target.value = ''; return; }

  if (isSvg) {
    const reader = new FileReader();
    reader.onload = () => {
      const root = sanitizeSvgString(reader.result);
      if (!root) { toast('El archivo SVG no es válido', 'err'); return; }
      let vb = root.getAttribute('viewBox');
      let w, h;
      if (vb) {
        const parts = vb.trim().split(/[\s,]+/).map(Number);
        w = parts[2]; h = parts[3];
      } else {
        w = parseFloat(root.getAttribute('width')) || 300;
        h = parseFloat(root.getAttribute('height')) || 300;
        vb = `0 0 ${w} ${h}`;
      }
      if (!w || !h || !isFinite(w) || !isFinite(h)) { toast('No se pudo determinar el tamaño del SVG', 'err'); return; }
      state.inst.useCustomImage = true;
      state.inst.customImage = { kind: 'svg', innerMarkup: root.innerHTML, viewBox: vb, naturalW: w, naturalH: h, originalName: file.name };
      renderControls();
      renderPreview();
      toast('Imagen SVG cargada en el bloque institucional', 'ok');
    };
    reader.onerror = () => toast('Error al leer el archivo SVG', 'err');
    reader.readAsText(file);
  } else {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const img = new Image();
      img.onload = () => {
        state.inst.useCustomImage = true;
        state.inst.customImage = { kind: 'raster', dataUrl, naturalW: img.naturalWidth, naturalH: img.naturalHeight, originalName: file.name };
        renderControls();
        renderPreview();
        toast('Imagen cargada en el bloque institucional', 'ok');
      };
      img.onerror = () => toast('No se pudo leer la imagen', 'err');
      img.src = dataUrl;
    };
    reader.onerror = () => toast('Error al leer el archivo', 'err');
    reader.readAsDataURL(file);
  }
  evt.target.value = '';
}

/* ========================================================================
   RESTABLECER
   ======================================================================== */
function resetAll() {
  const ok = confirm('¿Restablecer todo el logotipo a sus valores iniciales? Se perderán los cambios no guardados como proyecto.');
  if (!ok) return;
  state = defaultState();
  instUnlocked = false;
  customFontOpen = false;
  zoom = 1;
  pngResolution = 2;
  pngCustomWidth = null;
  batchTypo = { font: FONT_OPTIONS[0].value, size: 24, weight: 400, letterSpacing: 0.3, lineHeight: 1.18 };
  renderControls();
  renderPreview();
  toast('Configuración restablecida', 'ok');
}

/* ========================================================================
   GUARDAR / CARGAR PROYECTO (localStorage)
   ======================================================================== */
function saveProject() {
  try {
    localStorage.setItem(PROJECT_KEY, JSON.stringify(state));
    toast('Proyecto guardado en este navegador', 'ok');
  } catch (e) {
    console.error(e);
    toast('No se pudo guardar el proyecto', 'err');
  }
}
function loadProject() {
  try {
    const raw = localStorage.getItem(PROJECT_KEY);
    if (!raw) { toast('No hay ningún proyecto guardado todavía', 'err'); return; }
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.blocks)) { toast('El proyecto guardado no es válido', 'err'); return; }
    state = ensureStateShape(parsed);
    instUnlocked = false;
    renderControls();
    renderPreview();
    toast('Proyecto cargado', 'ok');
  } catch (e) {
    console.error(e);
    toast('Error al cargar el proyecto', 'err');
  }
}

document.getElementById('btnSaveProject').addEventListener('click', saveProject);
document.getElementById('btnLoadProject').addEventListener('click', loadProject);
document.getElementById('btnReset').addEventListener('click', resetAll);

/* ========================================================================
   INICIALIZACIÓN
   ======================================================================== */
function init() {
  const savedTheme = (function () { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } })() || 'light';
  applyTheme(savedTheme);

  const auto = loadAutosave();
  if (auto) state = ensureStateShape(Object.assign(defaultState(), auto));

  renderControls();
  renderPreview();

  window.addEventListener('resize', debounce(() => { /* el usuario puede reajustar con "Ajustar a pantalla" */ }, 200));

  requestAnimationFrame(() => {
    const fitBtn = document.getElementById('zoomFit');
    if (fitBtn) fitBtn.click();
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
