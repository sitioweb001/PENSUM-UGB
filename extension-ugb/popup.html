<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{margin:0;width:380px;font:14px/1.4 'Segoe UI',Arial,sans-serif;color:#0f172a;background:#fff}
.logos{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 12px;background:#fff;border-bottom:4px solid #1e3a8a}
.logos img{height:64px;max-width:170px;object-fit:contain}
.sep{width:1px;height:52px;background:#cbd5e1}
.b{padding:14px 16px 16px}
h1{margin:0 0 2px;font-size:17px;color:#1e3a8a}
.sub{font-size:11.5px;color:#64748b;margin-bottom:10px}
#s{font-size:13px;color:#475569;margin-bottom:8px}#s.ok{color:#047857;font-weight:700}
ul{margin:0 0 12px;padding:0;list-style:none;max-height:130px;overflow:auto;font-size:12px;color:#334155}
li{padding:3px 0;border-bottom:1px solid #e2e8f0}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#1e3a8a;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}button:not(:disabled):hover{background:#1e40af}
.f{font-size:10.5px;color:#94a3b8;text-align:center;margin-top:8px}
</style></head><body>
<div class="logos"><img src="logos/ugb.png" alt="Universidad Gerardo Barrios"><div class="sep"></div><img src="logos/di.jpg" alt="Dirección de Integración"></div>
<div class="b">
<h1>Pénsum UGB</h1><div class="sub">Extractor de notas del Portal del Estudiante</div>
<div id="s">Buscando tabla de notas…</div><ul id="l"></ul>
<button id="go" disabled>📥 Enviar notas a Pénsum UGB</button>
<div class="f">Se abre la app con vista previa; nada se guarda hasta que confirmes.</div>
</div>
<script src="popup.js"></script>
</body></html>
